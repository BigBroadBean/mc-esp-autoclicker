[esp]
enabled = true
menuKey = 45                  ; VK_INSERT = 45，呼出/关闭连点器菜单
maxDistance = 200.0
fov = 70.0                     ; 与游戏内 FOV 一致（默认 70）
box3d = true
box2d = false
nameTags = true
tracer = false
filledBox = false
lineWidth = 2
showPlayers = true
showMobs = true
showOthers = true
onlyWhenFocused = true
keepOnChat = true               ; 打开聊天（T）时继续渲染 ESP
smoothMs = 20.0                 ; 盒子时域平滑时间常数（毫秒）
renderHz = 120                  ; 渲染线程刷新率（Hz）
showTrajectory = true           ; 渲染弹射物预测轨迹
trajectoryTicks = 40            ; 轨迹预测长度（游戏 tick）

[clicker]
enabled = false                 ; 注入后初始是否启用连点
toggleKey = 4                   ; VK_MBUTTON = 4，启停连点热键
leftEnabled = false             ; 左键连点
rightEnabled = false            ; 右键连点
keep = false                    ; 保持模式：无需按住鼠标
cpsLeft10 = 100                 ; 左键 CPS*10（100 = 10.0 CPS）
cpsRight10 = 100                ; 右键 CPS*10
cpsMax = 50                     ; CPS 上限（20..500）
randomEnabled = false           ; 随机 CPS 波动
randomRange = 2                 ; 随机波动 ±CPS（1..5）
humanizeMode = 0                ; 0=均匀 1=双击连招 2=呼吸波动 3=疲劳递减
humanizeLevel = 3               ; 拟人化强度（1..5）
autoStopEnabled = false         ; 定时自动停止
autoStopSeconds = 30            ; N 秒后自动停止
attackGate = false              ; 仅准星目标可攻击时左键连点（内部 JNI 读取）
attackGateKey = 117             ; VK_F6 = 117
placeGate = false               ; 仅手持方块类物品时右键连点（内部 JNI 读取）
placeGateKey = 118              ; VK_F7 = 118
cursorGate = false              ; 光标可见（背包/聊天/菜单）时暂停

[colors]
player = 0xFF5555
mob = 0xFFAA00
other = 0x55FFFF
hud = 0xFFFFFF
trajectory = 0x00FF88
trajectoryOther = 0xFF0000 ; 其他玩家弓蓄力抛物线（红，区分本地玩家轨迹）
land = 0x00A0FF
landHit = 0xFF0000
