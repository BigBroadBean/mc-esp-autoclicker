[esp]
enabled = false
menuKey = 45          ; VK_INSERT = 45
maxDistance = 200.000000
fov = 70.000000                     ; 与游戏内 FOV 一致（默认 70）
box3d = true
box2d = false
nameTags = true
tracer = false
filledBox = false
lineWidth = 2
showPlayers = true
showMobs = true
showOthers = true
onlyWhenFocused = true
keepOnChat = true               ; 打开聊天（T）时继续渲染 ESP
smoothMs = 20.000000                 ; 盒子时域平滑时间常数（毫秒）
renderHz = 120                  ; 渲染线程刷新率（Hz）
showTrajectory = true           ; 渲染弹射物预测轨迹
trajectoryTicks = 40            ; 轨迹预测长度（游戏 tick）
[clicker]
activeProfile = 0
enabled = false              ; 注入后初始是否启用连点
toggleKey = 4               ; VK_MBUTTON = 4
leftEnabled = true
rightEnabled = true
keep = false                 ; 保持模式：无需按住鼠标
cpsLeft10 = 100             ; 左键 CPS*10（100=10.0CPS）
cpsRight10 = 100             ; 右键 CPS*10
cpsMax = 50               ; CPS 上限（20..500）
randomEnabled = false         ; 随机 CPS 波动
randomRange = 2               ; 随机波动 ±CPS（1..5）
humanizeMode = 0             ; 0=均匀 1=双击 2=呼吸 3=疲劳
humanizeLevel = 3             ; 拟人化强度（1..5）
autoStopEnabled = false        ; 定时自动停止
autoStopSeconds = 30            ; N 秒后自动停止
attackGate = false           ; 仅准星目标可攻击时左键连点
attackGateKey = 117              ; VK_F6 = 117
placeGate = false            ; 仅手持方块时右键连点
placeGateKey = 118              ; VK_F7 = 118
cursorGate = false           ; 光标可见时暂停连点
